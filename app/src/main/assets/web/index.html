<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NodeJsBox · Web 控制台</title>
<style>
  :root { --bg:#0b1220; --panel:#121a2b; --line:#233047; --fg:#dbe7ff; --dim:#7d93b8; --acc:#4da3ff; --ok:#3fd38a; --warn:#ffb454; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.5 system-ui, monospace; }
  header { display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0 8px 0 0; }
  #status { font-size:12px; color:var(--dim); }
  #status.on { color:var(--ok); } #status.off { color:var(--err); }
  main { display:grid; grid-template-columns: 1fr 1fr; gap:10px; padding:10px; }
  @media (max-width:760px){ main{ grid-template-columns:1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; display:flex; flex-direction:column; min-height:200px; margin-bottom:10px; }
  .title { padding:6px 10px; border-bottom:1px solid var(--line); font-weight:bold; display:flex; align-items:center; gap:8px; }
  .title small { color:var(--dim); font-weight:normal; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar { display:flex; gap:6px; padding:8px; border-bottom:1px solid var(--line); align-items:center; flex-wrap:wrap; }
  .bar input[type=text] { flex:1; min-width:120px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:5px; padding:5px 8px; font:inherit; }
  button { background:var(--bg); color:var(--acc); border:1px solid var(--line); border-radius:5px; padding:5px 10px; font:inherit; cursor:pointer; }
  button:active { filter:brightness(1.4); }
  button.danger { color:var(--err); }
  button.mini { padding:1px 7px; font-size:11px; flex:none; }
  .list { overflow:auto; max-height:260px; }
  .row { display:flex; gap:8px; padding:5px 10px; border-bottom:1px solid var(--line); align-items:center; cursor:pointer; }
  .row:hover { background:#182238; }
  .row.sel { background:#1c2b4a; }
  .row .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .meta { color:var(--dim); font-size:11px; white-space:nowrap; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--dim); margin-right:4px; }
  .dot.run { background:var(--ok); }
  .termout { flex:1; overflow:auto; padding:8px 10px; white-space:pre-wrap; word-break:break-all; font:12px/1.45 monospace; min-height:140px; max-height:46vh; }
  .termout .err { color:var(--err); } .termout .sys { color:var(--warn); } .termout .echo { color:var(--acc); }
  .hint { color:var(--dim); padding:6px 10px; font-size:11px; }
  .cwd { color:var(--dim); font-weight:normal; font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  dialog { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:8px; width:min(680px,92vw); max-height:80vh; padding:0; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog .bar { margin:0; }
  #edit { width:100%; height:52vh; background:var(--bg); color:var(--fg); border:0; padding:10px; font:12px/1.5 monospace; resize:vertical; }
  /* 开源许可：内容可达数百 KB（Node.js LICENSE 约 150KB / 2900 行），每段各自滚动 */
  .licsec { border-bottom:1px solid var(--line); }
  .licsec h3 { margin:0; padding:6px 10px; font-size:12px; color:var(--acc); background:#0f1728; position:sticky; top:0; }
  .licsec pre { margin:0; padding:10px; white-space:pre-wrap; word-break:break-word; font:11px/1.5 monospace; max-height:34vh; overflow:auto; }
</style>
</head>
<body>
<header>
  <h1>NodeJsBox · Web 控制台</h1>
  <button onclick="connect()">重连</button>
  <button onclick="showLicenses()">开源许可</button>
  <span id="status" class="off">未连接</span>
</header>
<main>
  <div>
    <!-- 文件查看器 -->
    <section id="files">
      <div class="title">文件 <small class="cwd" id="fcwd"></small></div>
      <div class="bar">
        <input type="text" id="fpath" placeholder="路径：空=沙箱根 · 相对=files/内 · 绝对=/data/data/…" onkeydown="if(event.key==='Enter')ls()">
        <button onclick="ls()">列出</button>
        <button onclick="up()">↑上级</button>
        <button onclick="newFile()">新建文件</button>
        <button onclick="mkdir()">新建目录</button>
      </div>
      <div class="list" id="flist"></div>
    </section>

    <!-- 进程查看器 -->
    <section id="proc">
      <div class="title">进程</div>
      <div class="bar">
        <button onclick="ps()">刷新</button>
        <button onclick="openWatch()">查看输出→临时终端</button>
        <button class="danger" onclick="killSelected()">停止</button>
        <button onclick="sigSelected()">Ctrl+C</button>
      </div>
      <div class="list" id="plist"></div>
      <div class="hint">点行选中；「查看输出」在下方临时终端附着该进程（历史+实时）· 列表每秒自动刷新</div>
    </section>
  </div>
  <div>
    <!-- 常驻终端：输入命令→执行→流式输出；每条命令的进程退出后仍保持附着（标题不丢） -->
    <section id="term">
      <div class="title">终端 <small id="sh-cwd"></small><small id="sh-title"></small></div>
      <div class="termout" id="sh-out"></div>
      <div class="bar">
        <input type="text" id="sh-in" placeholder="输入命令回车执行；附着进程运行中输入即写入其 stdin" onkeydown="if(event.key==='Enter')shSend()">
        <button onclick="shSend()">执行</button>
      </div>
    </section>

    <!-- 临时终端：进程查看器点「查看输出」后附着某个进程 -->
    <section id="watch">
      <div class="title">临时终端 <small id="w-title"></small> <span style="flex:1"></span><button onclick="wClose()">关闭附着</button></div>
      <div class="termout" id="w-out"><div class="hint">在进程查看器里点选进程 →「查看输出→临时终端」</div></div>
      <div class="bar">
        <input type="text" id="w-in" placeholder="写入该进程 stdin（回车发送）" onkeydown="if(event.key==='Enter')wSend()">
        <button onclick="wSend()">发送</button>
        <button onclick="wSig()">Ctrl+C</button>
      </div>
    </section>
  </div>
</main>

<!-- 文件查看/编辑弹窗 -->
<dialog id="dlg">
  <div class="bar">
    <input type="text" id="dpath" readonly style="flex:1">
    <button onclick="saveFile()">保存</button>
    <button class="danger" onclick="delFile()">删除</button>
    <button onclick="dlg.close()">关闭</button>
  </div>
  <textarea id="edit" spellcheck="false"></textarea>
</dialog>

<!-- 开源许可弹窗（内容来自 assets/licenses/，经 licenses.read 下发） -->
<dialog id="licdlg">
  <div class="title">开源许可 <small>内置运行时来源 + 各组件许可证</small></div>
  <div id="licbody" style="max-height:70vh;overflow:auto"></div>
  <div class="bar"><span style="flex:1"></span><button onclick="licdlg.close()">关闭</button></div>
</dialog>

<script>
// ---------------- WebSocket 客户端 ----------------
// 前端调试日志：WebView 里 console.* 自动镜像到 logcat（chrome 日志），过滤方式：
//   adb logcat -v time | findstr /i "NB-web console"
// 页面所有关键动作/异常/未捕获错误都经这里出口，便于真机侧排查
function dbgLog(tag, msg) { console.log("NB-web [" + tag + "] " + msg); }
function dbgErr(tag, msg, err) {
  const detail = err ? (err.stack || err.message || String(err)) : "";
  console.error("NB-web [" + tag + "] " + msg + (detail ? " | " + detail : ""));
}
window.addEventListener("error", e => dbgErr("window", e.message, e.error));
window.addEventListener("unhandledrejection", e => dbgErr("promise", "未处理的 Promise 异常", e.reason));

let ws = null, seq = 0, curDir = "";
const pending = new Map(); // seq -> {res,rej}
const watchers = new Map(); // 实例 id -> [cb]（多个终端面板各自独立订阅同一 id）

function connect() {
  if (ws) { ws.onclose = null; ws.close(); }
  ws = new WebSocket("ws://" + location.host + "/ws");
  // onopen 里的初始化各自 try/catch：任何一步抛错不得阻断后续（曾因 shLine 未定义导致整段中断）
  ws.onopen = () => {
    dbgLog("ws", "已连接,初始化: ls(scripts)/ps/定时器");
    setStatus("已连接", "on");
    try { sh.line("已连接后端", "sys"); } catch (e) { dbgErr("ws", "onopen 提示行失败", e); }
    try { ls("scripts"); } catch (e) { dbgErr("ws", "初始 ls(scripts) 失败", e); }
    try { ps(); } catch (e) { dbgErr("ws", "初始 ps 失败", e); }
    try { startPsTimer(); } catch (e) { dbgErr("ws", "启动 ps 定时器失败", e); }
  };
  ws.onclose = () => { dbgErr("ws", "连接断开,3s 后重连"); setStatus("断开，3s 后重连", "off"); try { sh.line("连接断开，自动重连…", "sys"); } catch (e) {} setTimeout(connect, 3000); };
  ws.onerror = () => ws.close();
  ws.onmessage = e => {
    let m;
    try { m = JSON.parse(e.data); }
    catch (err) { dbgErr("ws", "收到非法 JSON: " + String(e.data).slice(0, 200), err); return; }
    if (m.event) { (watchers.get(m.id) || []).forEach(cb => cb(m)); return; }
    const p = pending.get(m.seq);
    if (p) { pending.delete(m.seq); m.ok ? p.res(m.data ?? m) : p.rej(new Error(m.error || "命令失败")); }
    else dbgErr("ws", "收到无主响应(无对应 seq): " + String(e.data).slice(0, 200));
  };
}
function call(cmd, args = {}) {
  const t0 = Date.now();
  return new Promise((res, rej) => {
    if (!ws || ws.readyState !== 1) { dbgErr("call", cmd + " 拒发: 未连接"); return rej(new Error("未连接")); }
    const s = ++seq;
    dbgLog("call", "#" + s + " " + cmd + " " + JSON.stringify(args));
    pending.set(s, { res: v => { dbgLog("call", "#" + s + " " + cmd + " ok (" + (Date.now() - t0) + "ms)"); res(v); },
                     rej: e => { dbgErr("call", "#" + s + " " + cmd + " 失败 (" + (Date.now() - t0) + "ms)", e); rej(e); } });
    ws.send(JSON.stringify({ seq: s, cmd, args }));
  });
}
function setStatus(txt, cls) { const el = document.getElementById("status"); el.textContent = txt; el.className = cls; }

// 面板输出工具（每个终端面板一套，互不干扰）
function mkPanel(outId, titleId) {
  const el = document.getElementById(outId);
  return {
    line(s, cls) {
      const d = document.createElement("div");
      if (cls) d.className = cls;
      d.textContent = s;
      el.appendChild(d);
      while (el.children.length > 3000) el.removeChild(el.firstChild); // 行数封顶防卡顿
      el.scrollTop = el.scrollHeight;
    },
    title(s) { document.getElementById(titleId).textContent = s ? "· 附着: " + s : ""; },
    clear() { el.innerHTML = ""; },
  };
}
// 订阅某实例的流式事件（面板各自登记，关闭时解订）
function onProc(id, cb) { if (!watchers.has(id)) watchers.set(id, []); watchers.get(id).push(cb); }
function offProc(id, cb) {
  const arr = watchers.get(id); if (!arr) return;
  const i = arr.indexOf(cb); if (i >= 0) arr.splice(i, 1);
  if (!arr.length) { watchers.delete(id); call("proc.detach", { id }).catch(() => {}); } // 无人看了才解订
}
// proc.attach 响应 = {targets:[{id,lines,exited?,exitCode?}]}（多目标格式）→ 取第一个目标的历史行
function attachLines(r) { return (r.targets && r.targets[0] && r.targets[0].lines) || []; }
// attach 时进程已瞬间退出（exit 事件在订阅登记前就广播完了）→ 响应带 exited，前端据此收尾
function attachExited(r) { const t = r.targets && r.targets[0]; return t && t.exited ? t : null; }

// ---------------- 常驻终端 ----------------
const sh = mkPanel("sh-out", "sh-title");
let shPid = null; // 当前附着（= 最近一条命令）的实例 id；退出后仍保持，标题不丢
// 终端「当前目录」：
//  —— 虽然每条命令是独立进程，本质上 cd 跨命令无效 
//  —— 但前端跟踪一个目录，并作为 cwd 下传 shell.run（进程真实工作目录=跟踪目录），
//      所以 ls/cat/pwd/node <相对脚本>/复合命令都自然生效，无需再改写命令;
let shWd = "scripts"; // 相对 files/（空串=files/ 根）
function fmtWd(w) { return "files/" + (w || ""); }
function shShowWd() { document.getElementById("sh-cwd").textContent = "· 目录: " + fmtWd(shWd); }
function isSimpleCd(t) { const toks = t.split(/[|&;<>()$`\\"']/); return toks.length === 1 && /^cd(\s|$)/.test(toks[0].trim()); }
async function shRun0(text) {
  dbgLog("sh", "执行命令: " + text + " (cwd=" + shWd + ")");
  if (isSimpleCd(text)) {
    const arg = text.trim().slice(2).trim();
    if (!arg || arg === "~" || arg === ".") { shWd = ""; } // 容器里 ~ = HOME = files/
    else if (arg === "..") { const i = shWd.lastIndexOf("/"); shWd = i < 0 ? "" : shWd.slice(0, i); }
    else if (/^[\w.@+ -]+$/.test(arg)) { shWd = shWd ? shWd + "/" + arg : arg; }
    else { sh.line("! cd 仅支持简单相对路径（基于 files/）；绝对路径请在文件面板浏览", "err"); return; }
    shShowWd();
    sh.line("---- cd " + (arg || "~") + " → " + fmtWd(shWd) + " ----", "sys");
    return;
  }
  sh.line("$ " + text, "echo");
  const prev = shPid;
  if (prev) offProc(prev, shHandler); // 先解订旧实例再切 shPid：否则 offProc 会误删新实例的 watcher
  const r = await call("shell.run", { cmd: text, cwd: shWd }); // cwd 下传：进程在跟踪目录里启动
  shPid = r.id;
  sh.title(shPid + (r.pid ? " pid=" + r.pid : ""));
  onProc(shPid, shHandler); // 先登记再 attach：即使补历史失败也不丢后续事件
  try {
    const a = await call("proc.attach", { id: shPid, tail: 300 });
    const ex = attachExited(a);
    // 回放历史（瞬间退出的命令靠此看到报错）；跳过 pump 写入的内部标记行，
    // 它们与终端自己的“$ 命令”回显、下方合成的退出行重复
    attachLines(a).forEach(l => {
      if (/^----\s*(启动|停止请求|进程退出|\d+s 后自动重启)/.test(l)) return;
      sh.line(l);
    });
    if (ex) { // 命令瞬间退出：补上丢失的终结事件，避免 shPid 卡在死进程上
      sh.line("---- 进程退出 code=" + ex.exitCode + " ----", "sys");
      offProc(shPid, shHandler); shPid = null;
    }
  } catch (e) { sh.line("! attach: " + e.message, "err"); }
}
async function shSend() {
  const inp = document.getElementById("sh-in");
  const text = inp.value; inp.value = "";
  if (!text.trim()) return;
  if (shPid && watchers.has(shPid)) {
    // 上一条命令的进程还在跑：输入进它的 stdin
    dbgLog("sh", "路由到 stdin: id=" + shPid + " text=" + text);
    sh.line("> " + text, "echo");
    try {
      await call("proc.input", { id: shPid, text });
    } catch (e) {
      // 进程恰好已退出（exit 事件可能还没到）：降级为新命令重新执行
      sh.line("! " + e.message + "（改作新命令执行）", "err");
      offProc(shPid, shHandler); shPid = null;
      shRun0(text);
    }
    return;
  }
  shRun0(text);
}
function shHandler(m) {
  if (m.event === "out") sh.line(m.line);
  else if (m.event === "exit") {
    dbgLog("sh", "exit 事件 id=" + m.id + " code=" + m.code + " (shPid=" + shPid + ")");
    if (m.id !== shPid) return; // 迟到的旧命令 exit 事件：不能动当前命令的 watcher
    sh.line("---- 进程退出 code=" + m.code + " ----", "sys");
    offProc(m.id, shHandler); // 解订后 watchers 里没有 shPid，下次输入即新命令而非 stdin
  }
}

// ---------------- 临时终端（进程观察） ----------------
const w = mkPanel("w-out", "w-title");
let wPid = null;
function procMeta(i) { // 附着标题：id · 名称 · pid · 启动命令 · 启动时间
  if (!i) return "";
  const cmd = i.cmd || i.name || "";
  let s = " · " + i.name + " · pid=" + (i.pid || "?");
  s += " · " + (cmd.length > 90 ? cmd.slice(0, 90) + "…" : cmd);
  if (i.startedAt) s += " · 启动于 " + new Date(i.startedAt).toLocaleTimeString();
  return s;
}
async function openWatch() {
  if (!selId) { w.line("! 先在进程列表点选一行", "err"); return; }
  await wAttach(selId);
}
async function wAttach(id) {
  if (wPid && wPid !== id) offProc(wPid, wHandler);
  wPid = id;
  w.title(id + procMeta(procInfos.get(id)));
  w.clear();
  onProc(id, wHandler);
  try {
    const a = await call("proc.attach", { id, tail: 300 });
    const lines = attachLines(a);
    lines.forEach(l => w.line(l));
    w.line("==== 已附着 " + id + "（历史 " + lines.length + " 行，实时刷新）====", "sys");
  } catch (e) { w.line("! " + e.message, "err"); }
}
function wHandler(m) {
  if (m.event === "out") w.line(m.line);
  else if (m.event === "exit") w.line("---- 进程退出 code=" + m.code + " ----", "sys");
}
async function wSend() {
  const inp = document.getElementById("w-in");
  const text = inp.value; inp.value = "";
  if (!wPid || !text.trim()) return;
  try { w.line("> " + text, "echo"); await call("proc.input", { id: wPid, text }); }
  catch (e) { w.line("! " + e.message, "err"); }
}
async function wSig() {
  if (!wPid) return;
  try { await call("proc.signal", { id: wPid }); w.line("! 已发送 Ctrl+C", "sys"); }
  catch (e) { w.line("! " + e.message, "err"); }
}
function wClose() {
  if (wPid) offProc(wPid, wHandler);
  wPid = null; w.title("");
  w.clear();
  w.line("（附着已关闭）", "sys");
}

// ---------------- 进程查看器 ----------------
let selId = null, lastProcRow = null;
const procInfos = new Map(); // id -> info（标题用）
let psTimer = null;
function startPsTimer() { // 每秒自动刷新；重建列表不影响已附着终端，故无需暂停（ps 内部已吞异常，不可再 .catch）
  if (psTimer) return;
  psTimer = setInterval(() => { if (ws && ws.readyState === 1) ps(); }, 1000);
}
async function ps() {
  try {
    const r = await call("proc.list");
    procInfos.clear();
    const el = document.getElementById("plist");
    const scroll = el.scrollTop; // 刷新不重置滚动/选中
    dbgLog("ps", "刷新: 实例数=" + r.instances.length + " selId=" + selId + " scroll=" + scroll);
    const frag = document.createDocumentFragment();
    for (const i of r.instances) {
      procInfos.set(i.id, i);
      const cmd = i.cmd || i.name;
      const row = mkRow(i.id + "  ·  " + i.name,
        (i.pid ? "pid=" + i.pid + "  " : "") + (i.running ? "运行中" : "已退出" + (i.lastExitCode ?? "")) + "  ·  " + (cmd.length > 40 ? cmd.slice(0, 40) + "…" : cmd));
      row.querySelector(".name").prepend(dot(i.running));
      row.onclick = () => selectProc(row, i.id);
      if (i.id === selId) { row.classList.add("sel"); lastProcRow = row; } // 保持选中
      frag.appendChild(row);
    }
    el.innerHTML = "";
    if (!r.instances.length) { frag.innerHTML = "<div class='hint'>（没有进程实例）</div>"; selId = null; lastProcRow = null; }
    el.appendChild(frag);
    el.scrollTop = scroll;
    if (wPid) w.title(wPid + procMeta(procInfos.get(wPid))); // 临时终端标题跟随刷新（pid/命令可能后到）
  } catch (e) { dbgErr("ps", "proc.list 异常", e); sh.line("! proc.list: " + e.message, "err"); }
}
function selectProc(row, id) {
  if (lastProcRow) lastProcRow.classList.remove("sel");
  row.classList.add("sel"); lastProcRow = row; selId = id;
}
function dot(run) { const d = document.createElement("span"); d.className = "dot" + (run ? " run" : ""); return d; }
async function killSelected() {
  if (!selId) return sh.line("! 先点选进程", "err");
  try { await call("proc.kill", { id: selId }); sh.line("已请求停止 " + selId, "sys"); setTimeout(ps, 500); }
  catch (e) { sh.line("! " + e.message, "err"); }
}
async function sigSelected() {
  if (!selId) return sh.line("! 先点选进程", "err");
  try { await call("proc.signal", { id: selId }); sh.line("已发送 Ctrl+C " + selId, "sys"); }
  catch (e) { sh.line("! " + e.message, "err"); }
}

// ---------------- 文件查看器 ----------------
function abs(rel) { return curDir ? curDir + "/" + rel : rel; }
function ctxAbs(rel) { // 终端跟踪目录（相对 files/）→ 沙箱内绝对路径
  const root = "/data/data/com.nodejsbox.container/files";
  return rel ? root + "/" + rel : root;
}
async function ls(path) {
  const p = path ?? document.getElementById("fpath").value.trim(); // 空=沙箱根；相对=files/内；绝对=沙箱内任意
  try {
    const r = await call("fs.list", { path: p });
    curDir = r.path ?? "";
    document.getElementById("fpath").value = curDir;
    document.getElementById("fcwd").textContent = "· 所在: " + (curDir || "（沙箱根）");
    const el = document.getElementById("flist"); el.innerHTML = "";
    for (const e of r.entries) {
      const row = mkRow((e.dir ? "📁 " : "📄 ") + e.name, fmtSize(e.size));
      row.onclick = () => e.dir ? ls(abs(e.name)) : openFile(abs(e.name));
      if (!e.dir && e.name.toLowerCase().endsWith(".js")) { // js 脚本：一键把运行命令填进终端输入框（不自动执行）
        const btn = document.createElement("button");
        btn.className = "mini"; btn.textContent = "▶ 运行";
        btn.title = "填充「node " + ctxAbs(abs(e.name)) + "」到终端输入框";
        btn.onclick = ev => { ev.stopPropagation(); fillRunCmd("node " + ctxAbs(abs(e.name))); };
        row.appendChild(btn);
      }
      el.appendChild(row);
    }
    if (!r.entries.length) el.innerHTML = "<div class='hint'>（空目录）</div>";
    dbgLog("fs", "ls(\"" + p + "\") → curDir=" + curDir + " 条目数=" + r.entries.length);
  } catch (e) { dbgErr("fs", "fs.list 失败: path=" + p, e); sh.line("! fs.list: " + e.message, "err"); }
}
function up() {
  const i = curDir.lastIndexOf("/");
  ls(i < 0 ? "" : curDir.slice(0, i));
}
function mkRow(name, meta) {
  const d = document.createElement("div"); d.className = "row";
  const n = document.createElement("span"); n.className = "name"; n.textContent = name;
  const m = document.createElement("span"); m.className = "meta"; m.textContent = meta;
  d.append(n, m); return d;
}
function fmtSize(s) { return s >= 1048576 ? (s / 1048576).toFixed(1) + "M" : s >= 1024 ? (s / 1024).toFixed(1) + "K" : s + "B"; }
function fillRunCmd(cmd) { // 只填充终端输入框，由用户确认后手动执行
  const inp = document.getElementById("sh-in");
  inp.value = cmd; inp.focus();
  sh.line("已填充命令到终端输入框：" + cmd, "sys");
}
async function openFile(path) {
  try {
    const r = await call("fs.read", { path });
    document.getElementById("dpath").value = path;
    document.getElementById("edit").value = r.content;
    document.getElementById("dlg").showModal();
  } catch (e) { sh.line("! " + e.message, "err"); }
}
async function saveFile() {
  const path = document.getElementById("dpath").value;
  try { await call("fs.write", { path, content: document.getElementById("edit").value }); sh.line("已保存 " + path, "sys"); }
  catch (e) { sh.line("! " + e.message, "err"); }
}
async function delFile() {
  const path = document.getElementById("dpath").value;
  if (!confirm("删除 " + path + " ？")) return;
  try { await call("fs.delete", { path }); document.getElementById("dlg").close(); sh.line("已删除 " + path, "sys"); ls(curDir); }
  catch (e) { sh.line("! " + e.message, "err"); }
}
async function newFile() {
  const name = prompt("新建文件名（相对当前目录）");
  if (!name) return;
  try { await call("fs.write", { path: abs(name), content: "" }); ls(curDir); openFile(abs(name)); }
  catch (e) { sh.line("! " + e.message, "err"); }
}
async function mkdir() {
  const name = prompt("新建目录名（相对当前目录）");
  if (!name) return;
  try { await call("fs.mkdir", { path: abs(name) }); ls(curDir); }
  catch (e) { sh.line("! " + e.message, "err"); }
}

// ---------------- 开源许可 ----------------
// 两条内置条目的 name 直接用 assets/licenses/ 下的文件名（与后端 WebServer.LICENSE_ITEMS 一致）；首次打开拉取后常驻内存缓存
const LIC_ITEMS = [["notices.txt", "内置运行时 · 来源与许可告知"], ["node-LICENSE.txt", "Node.js LICENSE（含自带第三方组件全文）"]];
let licCache = null;
async function showLicenses() {
  const box = document.getElementById("licbody");
  box.innerHTML = "";
  document.getElementById("licdlg").showModal();
  try {
    if (!licCache) {
      const rs = await Promise.all(LIC_ITEMS.map(([n]) => call("licenses.read", { name: n })));
      licCache = rs.map((r, i) => ({ title: LIC_ITEMS[i][1], content: r.content }));
    }
    for (const s of licCache) {
      const sec = document.createElement("div"); sec.className = "licsec";
      const h = document.createElement("h3"); h.textContent = s.title;
      const pre = document.createElement("pre"); pre.textContent = s.content;
      sec.append(h, pre); box.appendChild(sec);
    }
  } catch (e) {
    dbgErr("lic", "licenses.read 失败", e);
    box.innerHTML = "<div class='hint'>! " + e.message + "</div>";
  }
}

connect();
shShowWd(); // 初始目录展示（与文件面板默认 scripts 一致）
